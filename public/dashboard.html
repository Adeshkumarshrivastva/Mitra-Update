<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MITRA Mind Check Dashboard</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="dash-body">
    <main class="dash">
      <header class="dash-head">
        <div>
          <h1>Mind Check dashboard</h1>
          <p id="source">Loading...</p>
        </div>
        <div class="dash-actions">
          <a class="mc-linkbtn" href="/">Back to MITRA</a>
          <button id="exportCsv" class="mc-primary dash-export" type="button">Export CSV</button>
        </div>
      </header>
      <section id="stats" class="dash-stats"></section>
      <section class="dash-filters">
        <input id="search" type="search" placeholder="Search name or mobile">
        <select id="tierFilter">
          <option value="">All priorities</option>
          <option value="urgent">Urgent</option>
          <option value="elevated">Needs attention</option>
          <option value="normal">Normal</option>
        </select>
        <select id="kindFilter">
          <option value="">Both tests</option>
          <option value="anxiety">Anxiety / GAD-7</option>
          <option value="depression">Depression / PHQ-9</option>
        </select>
        <select id="dueFilter">
          <option value="">Any follow-up</option>
          <option value="due">Follow-up due</option>
        </select>
      </section>
      <section class="dash-table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Type</th><th>Participant</th><th>Score</th><th>Band</th><th>Change</th><th>Priority</th><th>Follow-up</th><th>Expression</th><th>Camera</th><th>Report</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" class="dash-empty" hidden>No submissions yet. Complete a Mind Check to see it here.</p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="./mindcheck-data.js"></script>
    <script src="./mindcheck-report.js"></script>
    <script src="./mindcheck-store.js"></script>
    <script src="./dashboard.js"></script>
  </body>
</html>
