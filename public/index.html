<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MITRA</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-label="MITRA voice assistant">
        <header class="topbar">
          <div class="mark" aria-hidden="true">M</div>
          <div>
            <h1>MITRA</h1>
            <p>Highway voice companion</p>
          </div>
        </header>

        <div class="stage" aria-live="polite">
          <button id="micButton" class="mic-button" type="button" aria-label="Talk to MITRA">
            <span class="pulse" aria-hidden="true"></span>
            <span class="mic-shape" aria-hidden="true"></span>
          </button>
          <p id="statusText" class="status">Tap to speak</p>
          <p id="hintText" class="hint">MITRA will listen for a short turn and reply by voice.</p>
        </div>

        <div class="meter" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <audio id="remoteAudio" autoplay playsinline></audio>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
