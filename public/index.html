<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MITRA</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page">
      <section class="assistant" aria-label="MITRA voice assistant">
        <header class="brand">
          <div class="brand-mark">Mi</div>
          <div>
            <h1>MITRA</h1>
            <p>Aapka apna saathi</p>
          </div>
        </header>

        <div class="orb-wrap" aria-hidden="true">
          <div id="orb" class="orb">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <button id="micButton" class="mic-button" type="button" aria-label="Speak to MITRA">
          <span class="mic-icon"></span>
        </button>

        <p id="statusText" class="status">Checking MITRA</p>
        <p id="hintText" class="hint">Allow microphone access when the browser asks.</p>

        <div class="controls">
          <button id="stopButton" class="secondary" type="button">Stop</button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
